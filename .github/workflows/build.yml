name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unzip project
        run: unzip -o MyAssistantAndroid_Project.zip -d project
      - name: Fix Java and Kotlin target
        working-directory: project/MyAssistantAndroid
        run: |
          sed -i 's/defaultConfig {/compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = "17"\n    }\n    defaultConfig {/' app/build.gradle.kts
      - name: Fix code errors
        working-directory: project/MyAssistantAndroid
        run: |
          F=app/src/main/java/com/example/myassistant/MainActivity.kt
          sed -i 's/singleLine = true/isSingleLine = true/' $F
          sed -i 's/catch (_: Exception)/catch (e: Exception)/' $F
      - name: Build
        working-directory: project/MyAssistantAndroid
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        working-directory: project/MyAssistantAndroid
        run: |
          grep -n "^e: " build.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: MyAssistant-apk
          path: project/MyAssistantAndroid/app/build/outputs/apk/debug/*.apk
